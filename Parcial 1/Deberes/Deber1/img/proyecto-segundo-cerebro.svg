<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070a" />
      <stop offset="100%" stop-color="#111116" />
    </linearGradient>
    <linearGradient id="glow-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="node-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-brain)"/>

  <!-- Network Nodes Ambient Background -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.12">
    <line x1="180" y1="120" x2="310" y2="200" />
    <line x1="310" y1="200" x2="490" y2="160" />
    <line x1="490" y1="160" x2="620" y2="250" />
    <line x1="310" y1="200" x2="380" y2="330" />
    <line x1="380" y1="330" x2="550" y2="340" />
    <line x1="490" y1="160" x2="550" y2="340" />
  </g>
  <circle cx="180" cy="120" r="4" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="310" cy="200" r="6" fill="#ffffff" fill-opacity="0.7" />
  <circle cx="490" cy="160" r="7" fill="#ffffff" />
  <circle cx="620" cy="250" r="5" fill="#ffffff" fill-opacity="0.4" />
  <circle cx="380" cy="330" r="5" fill="#ffffff" fill-opacity="0.5" />
  <circle cx="550" cy="340" r="6" fill="#ffffff" fill-opacity="0.6" />

  <!-- Window Frame -->
  <rect x="60" y="35" width="680" height="380" rx="14" fill="#0c0c10" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="35" width="680" height="44" rx="14" fill="#15151c" />
  <rect x="60" y="65" width="680" height="14" fill="#15151c" />
  <circle cx="90" cy="57" r="5" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="108" cy="57" r="5" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="126" cy="57" r="5" fill="#ffffff" fill-opacity="0.2" />
  <text x="400" y="62" fill="#a0a0ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="1">SEGUNDO CEREBRO • KNOWLEDGE &amp; AI AGENT</text>

  <!-- Left Navigation Column -->
  <rect x="80" y="100" width="160" height="295" rx="8" fill="#101015" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect x="95" y="120" width="130" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
  <text x="110" y="137" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">🧠 Base de Conocimiento</text>
  <text x="110" y="172" fill="#888894" font-family="sans-serif" font-size="11">📂 Módulos de Estudio</text>
  <text x="110" y="202" fill="#888894" font-family="sans-serif" font-size="11">⚡ Asistente Contextual</text>
  <text x="110" y="232" fill="#888894" font-family="sans-serif" font-size="11">📊 Grafo de Notas</text>
  <text x="110" y="262" fill="#888894" font-family="sans-serif" font-size="11">⚙️ Ajustes API</text>

  <!-- Main AI Chat & Search Interface -->
  <rect x="260" y="100" width="460" height="44" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="280" y="127" fill="#70707c" font-family="sans-serif" font-size="12">🔍 Buscar conceptos, algoritmos o consultar al agente inteligente...</text>

  <!-- Chat / Notes Cards -->
  <rect x="260" y="160" width="460" height="110" rx="8" fill="#121217" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="280" y="188" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Síntesis Semántica: Arquitectura Web Limpia</text>
  <text x="280" y="210" fill="#9a9aa5" font-family="sans-serif" font-size="11">Desacoplamiento frontend/backend mediante controladores REST y entidades de dominio.</text>
  <text x="280" y="228" fill="#9a9aa5" font-family="sans-serif" font-size="11">Integración exitosa con bases de datos relacionales y autenticación por tokens.</text>
  <rect x="280" y="244" width="75" height="16" rx="8" fill="#ffffff" fill-opacity="0.1"/>
  <text x="290" y="256" fill="#ffffff" font-family="sans-serif" font-size="9">Python Fast</text>
  <rect x="365" y="244" width="75" height="16" rx="8" fill="#ffffff" fill-opacity="0.1"/>
  <text x="375" y="256" fill="#ffffff" font-family="sans-serif" font-size="9">Vector Index</text>

  <!-- Prompt Box -->
  <rect x="260" y="285" width="460" height="110" rx="8" fill="#101015" stroke="#ffffff" stroke-opacity="0.08" />
  <rect x="275" y="300" width="30" height="30" rx="6" fill="#ffffff" fill-opacity="0.15" />
  <text x="285" y="320" fill="#ffffff" font-family="sans-serif" font-size="14">AI</text>
  <text x="315" y="315" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Consulta ejecutada</text>
  <text x="315" y="330" fill="#8e8e9b" font-family="sans-serif" font-size="11">Tiempo de inferencia: 42ms • Conexión de conocimiento activa</text>

  <rect x="275" y="348" width="430" height="34" rx="6" fill="#181822" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="290" y="370" fill="#60606e" font-family="sans-serif" font-size="11">Pregunta cualquier tema de tu repositorio de conocimientos...</text>
</svg>
