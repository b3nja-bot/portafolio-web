<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-crud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090c" />
      <stop offset="100%" stop-color="#121217" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-crud)"/>

  <!-- Code / Database Grid -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05">
    <line x1="0" y1="112" x2="800" y2="112" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="337" x2="800" y2="337" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Window Frame -->
  <rect x="55" y="35" width="690" height="380" rx="14" fill="#0d0d12" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Header -->
  <rect x="55" y="35" width="690" height="44" rx="14" fill="#16161e" />
  <rect x="55" y="65" width="690" height="14" fill="#16161e" />
  <circle cx="85" cy="57" r="5" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="103" cy="57" r="5" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="121" cy="57" r="5" fill="#ffffff" fill-opacity="0.2" />
  <text x="400" y="62" fill="#a0a0ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="1">GESTIÓN DE INVENTARIO Y CLIENTES • CRUD PHP &amp; MYSQL</text>

  <!-- Top Controls -->
  <rect x="80" y="98" width="180" height="34" rx="6" fill="#14141b" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="95" y="120" fill="#7a7a88" font-family="sans-serif" font-size="11">Filtrar registros...</text>

  <!-- Action Button (New Record) -->
  <rect x="580" y="98" width="140" height="34" rx="6" fill="#ffffff" />
  <text x="650" y="120" fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ NUEVO REGISTRO</text>

  <!-- Database Table Container -->
  <rect x="80" y="148" width="640" height="245" rx="8" fill="#111116" stroke="#ffffff" stroke-opacity="0.08" />

  <!-- Table Header -->
  <rect x="80" y="148" width="640" height="36" rx="8" fill="#181822" />
  <rect x="80" y="174" width="640" height="10" fill="#181822" />
  <g fill="#90909e" font-family="sans-serif" font-size="11" font-weight="600">
    <text x="105" y="171">ID</text>
    <text x="160" y="171">NOMBRE PRODUCTO / CLIENTE</text>
    <text x="390" y="171">CATEGORÍA</text>
    <text x="500" y="171">ESTADO</text>
    <text x="610" y="171">ACCIONES</text>
  </g>

  <!-- Row 1 -->
  <rect x="90" y="194" width="620" height="38" rx="6" fill="#ffffff" fill-opacity="0.03" />
  <text x="105" y="218" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">#01</text>
  <text x="160" y="218" fill="#ffffff" font-family="sans-serif" font-size="11">Procesador Ryzen 7 5700X</text>
  <text x="390" y="218" fill="#a0a0ab" font-family="sans-serif" font-size="11">Hardware</text>
  <rect x="500" y="205" width="65" height="18" rx="9" fill="#ffffff" fill-opacity="0.12"/>
  <text x="515" y="218" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">ACTIVO</text>
  <g fill="#ffffff" fill-opacity="0.2">
    <rect x="610" y="206" width="22" height="18" rx="4"/>
    <rect x="640" y="206" width="22" height="18" rx="4"/>
  </g>

  <!-- Row 2 -->
  <rect x="90" y="240" width="620" height="38" rx="6" fill="#ffffff" fill-opacity="0.015" />
  <text x="105" y="264" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">#02</text>
  <text x="160" y="264" fill="#ffffff" font-family="sans-serif" font-size="11">Memoria RAM 32GB DDR4</text>
  <text x="390" y="264" fill="#a0a0ab" font-family="sans-serif" font-size="11">Componentes</text>
  <rect x="500" y="251" width="65" height="18" rx="9" fill="#ffffff" fill-opacity="0.12"/>
  <text x="515" y="264" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">ACTIVO</text>
  <g fill="#ffffff" fill-opacity="0.2">
    <rect x="610" y="252" width="22" height="18" rx="4"/>
    <rect x="640" y="252" width="22" height="18" rx="4"/>
  </g>

  <!-- Row 3 -->
  <rect x="90" y="286" width="620" height="38" rx="6" fill="#ffffff" fill-opacity="0.03" />
  <text x="105" y="310" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">#03</text>
  <text x="160" y="310" fill="#ffffff" font-family="sans-serif" font-size="11">Monitor Gaming 27" 165Hz</text>
  <text x="390" y="310" fill="#a0a0ab" font-family="sans-serif" font-size="11">Pantallas</text>
  <rect x="500" y="297" width="65" height="18" rx="9" fill="#ffffff" fill-opacity="0.12"/>
  <text x="515" y="310" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">ACTIVO</text>
  <g fill="#ffffff" fill-opacity="0.2">
    <rect x="610" y="298" width="22" height="18" rx="4"/>
    <rect x="640" y="298" width="22" height="18" rx="4"/>
  </g>

  <!-- Row 4 -->
  <rect x="90" y="332" width="620" height="38" rx="6" fill="#ffffff" fill-opacity="0.015" />
  <text x="105" y="356" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">#04</text>
  <text x="160" y="356" fill="#ffffff" font-family="sans-serif" font-size="11">Teclado Mecánico Custom</text>
  <text x="390" y="356" fill="#a0a0ab" font-family="sans-serif" font-size="11">Periféricos</text>
  <rect x="500" y="343" width="65" height="18" rx="9" fill="#ffffff" fill-opacity="0.08"/>
  <text x="515" y="356" fill="#888894" font-family="sans-serif" font-size="9" font-weight="600">AGOTADO</text>
  <g fill="#ffffff" fill-opacity="0.2">
    <rect x="610" y="344" width="22" height="18" rx="4"/>
    <rect x="640" y="344" width="22" height="18" rx="4"/>
  </g>
</svg>
