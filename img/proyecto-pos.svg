<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#141419" />
    </linearGradient>
    <linearGradient id="accent-pos" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#8a8a93" />
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-pos)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Window Frame -->
  <rect x="50" y="35" width="700" height="380" rx="14" fill="#0d0d12" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Window Top Bar -->
  <rect x="50" y="35" width="700" height="44" rx="14" fill="#17171f" />
  <rect x="50" y="65" width="700" height="14" fill="#17171f" />
  <circle cx="80" cy="57" r="5" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="98" cy="57" r="5" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="116" cy="57" r="5" fill="#ffffff" fill-opacity="0.2" />
  <text x="400" y="62" fill="#a0a0ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="1">SISTEMA POS &amp; FACTURACIÓN ELECTRÓNICA</text>

  <!-- Sidebar -->
  <rect x="70" y="99" width="140" height="296" rx="8" fill="#121218" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect x="85" y="118" width="110" height="24" rx="6" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="85" y="152" width="110" height="18" rx="4" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="85" y="178" width="110" height="18" rx="4" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="85" y="204" width="110" height="18" rx="4" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="85" y="230" width="110" height="18" rx="4" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Metric Cards -->
  <rect x="230" y="99" width="150" height="80" rx="8" fill="#121218" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="245" y="123" fill="#8e8e99" font-family="sans-serif" font-size="11">VENTAS HOY</text>
  <text x="245" y="153" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">$ 2,450.80</text>
  <rect x="245" y="163" width="55" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>

  <rect x="400" y="99" width="150" height="80" rx="8" fill="#121218" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="415" y="123" fill="#8e8e99" font-family="sans-serif" font-size="11">TICKETS EMITIDOS</text>
  <text x="415" y="153" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">148</text>
  <rect x="415" y="163" width="70" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>

  <rect x="570" y="99" width="150" height="80" rx="8" fill="#121218" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="585" y="123" fill="#8e8e99" font-family="sans-serif" font-size="11">STOCK ALERTA</text>
  <text x="585" y="153" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">3 ÍTEMS</text>
  <rect x="585" y="163" width="45" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Chart / Table Area -->
  <rect x="230" y="195" width="490" height="200" rx="8" fill="#121218" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="250" y="224" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Registro de Transacciones en Vivo</text>

  <!-- Mini Table Rows -->
  <g fill="#ffffff" fill-opacity="0.05">
    <rect x="250" y="240" width="450" height="30" rx="4" />
    <rect x="250" y="278" width="450" height="30" rx="4" />
    <rect x="250" y="316" width="450" height="30" rx="4" />
    <rect x="250" y="354" width="450" height="30" rx="4" />
  </g>
  <g fill="#a0a0ab" font-family="sans-serif" font-size="11">
    <text x="265" y="260">#TRX-8921</text>
    <text x="370" y="260">Cliente Mostrador</text>
    <text x="540" y="260">Efectivo / Caja</text>
    <text x="660" y="260" fill="#ffffff" font-weight="600">$45.00</text>

    <text x="265" y="298">#TRX-8922</text>
    <text x="370" y="298">Empresa Industrial</text>
    <text x="540" y="298">Factura 001-002</text>
    <text x="660" y="298" fill="#ffffff" font-weight="600">$320.50</text>

    <text x="265" y="336">#TRX-8923</text>
    <text x="370" y="336">María Benítez</text>
    <text x="540" y="336">Transferencia</text>
    <text x="660" y="336" fill="#ffffff" font-weight="600">$89.20</text>

    <text x="265" y="374">#TRX-8924</text>
    <text x="370" y="374">Consumidor Final</text>
    <text x="540" y="374">Tarjeta Débito</text>
    <text x="660" y="374" fill="#ffffff" font-weight="600">$12.50</text>
  </g>
</svg>
